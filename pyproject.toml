[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "mcp_bigquery"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/profile.py" = ["E501"]
"mcp_bigquery/answer_questions.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
